# API de Ecomerxio POS en Render (Blueprint): New → Blueprint → este repositorio. El frontend va en Vercel (frontend/vercel.json).
# Base de datos propia (proyecto nuevo en Neon o Supabase, separado de Ecomerxio): ver docs/DESPLIEGUE_RENDER.md.
# Las variables sync:false las pide Render al crear.
services:
  - type: web
    name: ecomerxio-pos
    runtime: docker
    plan: starter               # como ecomerxio-api: el plan free se duerme tras 15 min sin visitas
    region: virginia            # crea la base en US East (Virginia) para que quede cerca
    rootDir: backend
    dockerfilePath: ./Dockerfile  # backend/Dockerfile: solo la API
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # jdbc:postgresql://<host>:<puerto>/<base>?sslmode=require  (en Supabase, el "Session pooler", puerto 5432)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Planes gratis de Neon/Supabase: pocas conexiones.
      - key: DB_POOL_MAX_SIZE
        value: "8"
      - key: JWT_SECRET
        generateValue: true
      # El frontend está en Vercel (pos.ecomerxio.com) y también incrustado en ecomerxio.com/pos; los dos reenvían su
      # /api a este servicio. FRONTEND_URL arma los enlaces de los correos (recuperar clave) y la vitrina /t/:slug.
      - key: FRONTEND_URL
        value: https://pos.ecomerxio.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://pos.ecomerxio.com,https://www.ecomerxio.com,https://ecomerxio.com
      - key: ASSISTANT_ENABLED
        value: "false"
      # Pago de la suscripción con la cuenta Wompi de la plataforma (las mismas llaves que usa ecomerxio-api).
      # Sandbox: WOMPI_BASE_URL=https://sandbox.wompi.co/v1 y llaves pub_test_/prv_test_/test_integrity_.
      - key: BILLING_ENABLED
        value: "false"
      - key: WOMPI_BASE_URL
        value: https://production.wompi.co/v1
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      # Facturación electrónica: SIMULADO (sin validez) o FACTUS. Con FACTUS, el ambiente de pruebas usa el sandbox.
      - key: EINVOICE_PROVIDER
        value: SIMULADO
      - key: FACTUS_SANDBOX_CLIENT_ID
        sync: false
      - key: FACTUS_SANDBOX_CLIENT_SECRET
        sync: false
      - key: FACTUS_SANDBOX_USERNAME
        sync: false
      - key: FACTUS_SANDBOX_PASSWORD
        sync: false
      # Llave del Super Admin de Ecomerxio (/api/platform): la MISMA que PLATFORM_ADMIN_KEY en ecomerxio-api.
      - key: PLATFORM_ADMIN_KEY
        sync: false
