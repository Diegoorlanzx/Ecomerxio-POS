# Ecomerxio POS en Render (Blueprint): New → Blueprint → este repositorio.
# Usa la MISMA base de datos que ecomerxio-api, en su propio esquema "pos" (ver docs/DESPLIEGUE_RENDER.md):
# mismo servidor y mismo pago, datos separados. Las variables sync:false las pide Render al crear.
services:
  - type: web
    name: ecomerxio-pos
    runtime: docker
    plan: starter               # como ecomerxio-api: el plan free se duerme tras 15 min sin visitas
    region: virginia            # la misma región de ecomerxio-api y de su base de datos
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # La de ecomerxio-api terminada en &currentSchema=pos (o ?currentSchema=pos si no tiene parámetros).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Comparte el límite de conexiones con ecomerxio-api (que usa 8): pool pequeño.
      - key: DB_POOL_MAX_SIZE
        value: "4"
      - key: JWT_SECRET
        generateValue: true
      # La app se usa incrustada en ecomerxio.com/pos (microfrontend): Vercel reenvía ecomerxio.com/pos-app/* a este
      # servicio. FRONTEND_URL arma los enlaces de los correos (recuperar clave) y la vitrina /t/:slug.
      - key: FRONTEND_URL
        value: https://www.ecomerxio.com/pos
      - key: CORS_ALLOWED_ORIGINS
        value: https://www.ecomerxio.com,https://ecomerxio.com
