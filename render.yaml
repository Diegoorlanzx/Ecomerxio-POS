# Ecomerxio POS en Render (Blueprint): New → Blueprint → este repositorio.
# Base de datos propia (proyecto nuevo en Neon o Supabase, separado de Ecomerxio): ver docs/DESPLIEGUE_RENDER.md.
# Las variables sync:false las pide Render al crear.
services:
  - type: web
    name: ecomerxio-pos
    runtime: docker
    plan: starter               # como ecomerxio-api: el plan free se duerme tras 15 min sin visitas
    region: virginia            # crea la base en US East (Virginia) para que quede cerca
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # jdbc:postgresql://<host>:<puerto>/<base>?sslmode=require  (en Supabase, el "Session pooler", puerto 5432)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Planes gratis de Neon/Supabase: pocas conexiones.
      - key: DB_POOL_MAX_SIZE
        value: "8"
      - key: JWT_SECRET
        generateValue: true
      # La app se usa incrustada en ecomerxio.com/pos (microfrontend): Vercel reenvía ecomerxio.com/pos-app/* a este
      # servicio. FRONTEND_URL arma los enlaces de los correos (recuperar clave) y la vitrina /t/:slug.
      - key: FRONTEND_URL
        value: https://www.ecomerxio.com/pos
      - key: CORS_ALLOWED_ORIGINS
        value: https://www.ecomerxio.com,https://ecomerxio.com
