# Producción: se activa con SPRING_PROFILES_ACTIVE=prod. Todo lo sensible llega por variables de entorno.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}

server:
  port: ${PORT:8080}
  # Detrás de un proxy con HTTPS (Caddy, Nginx, el balanceador del proveedor). "native" = RemoteIpValve de
  # Tomcat: toma la IP del cliente de derecha a izquierda en X-Forwarded-For, saltando solo proxies internos
  # (con "framework" Spring tomaba el primer valor, que el cliente puede inventar).
  # Proxies de confianza: por defecto las redes privadas (10.x, 172.16-31.x, 192.168.x, 100.64-127.x, localhost),
  # donde está el balanceador de Render. Si la auditoría muestra la IP del balanceador en vez de la del usuario,
  # ajustar con la variable SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (expresión regular).
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,text/javascript,image/svg+xml,application/manifest+json
    min-response-size: 1024
  shutdown: graceful

app:
  jwt:
    # Sin valor por defecto: en producción es obligatorio (mínimo 32 caracteres aleatorios).
    secret: ${JWT_SECRET}
  cors:
    # Orígenes (solo esquema y dominio) que pueden llamar a la API. Incrustada en ecomerxio.com las peticiones
    # llegan reenviadas por Vercel con ese origen.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}
  frontend-url: ${FRONTEND_URL}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
