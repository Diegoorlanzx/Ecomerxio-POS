spring:
  application:
    name: tiendaposs
  web:
    locale: es
    locale-resolver: fixed
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55434/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      # Con la base saturada, mejor responder "ocupado" (503) en 5 s que dejar cientos de peticiones colgadas.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      # Ninguna consulta puede retener una conexión más de este tiempo (consultas pesadas a propósito).
      connection-init-sql: SET statement_timeout = '${DB_STATEMENT_TIMEOUT:60s}'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8090}
  # Contra avalanchas y conexiones lentas a propósito (slowloris): tiempos y tamaños acotados.
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 15s
    keep-alive-timeout: 15s
    max-keep-alive-requests: 200
    max-connections: 4096
    accept-count: 200
    threads:
      max: ${SERVER_THREADS_MAX:200}
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    # Sesión de un turno de trabajo largo.
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    # En desarrollo también el login de Ecomerxio (localhost:5173), que prueba las credenciales aquí.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5190},http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5190}
  mail-from: ${MAIL_FROM:no-responder@tiendaposs.com}
  # Asistente IA (Claude). Sin clave el asistente funciona en "modo consultas rápidas".
  ai:
    # Interruptor de toda la plataforma: apagado, la app no muestra el asistente y su API responde 404.
    # (Las recomendaciones de precio no usan IA y siguen activas.)
    enabled: ${ASSISTANT_ENABLED:false}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5-5}
  # Fase 16D: proveedor tecnológico de facturación electrónica. SIMULADO (por defecto, sin validez) o FACTUS.
  einvoice:
    provider: ${EINVOICE_PROVIDER:SIMULADO}
    factus:
      sandbox:
        url: ${FACTUS_SANDBOX_URL:https://api-sandbox.factus.com.co}
        client-id: ${FACTUS_SANDBOX_CLIENT_ID:}
        client-secret: ${FACTUS_SANDBOX_CLIENT_SECRET:}
        username: ${FACTUS_SANDBOX_USERNAME:}
        password: ${FACTUS_SANDBOX_PASSWORD:}
      prod:
        url: ${FACTUS_PROD_URL:https://api.factus.com.co}
        client-id: ${FACTUS_PROD_CLIENT_ID:}
        client-secret: ${FACTUS_PROD_CLIENT_SECRET:}
        username: ${FACTUS_PROD_USERNAME:}
        password: ${FACTUS_PROD_PASSWORD:}
  # Pago de la suscripción del POS con la cuenta Wompi de la PLATAFORMA (la misma de Ecomerxio). Apagado sin las 3 llaves.
  # Sandbox: WOMPI_BASE_URL=https://sandbox.wompi.co/v1 y llaves pub_test_/prv_test_/test_integrity_.
  billing:
    enabled: ${BILLING_ENABLED:false}
    # Vencida la prueba o el pago, 5 días de gracia y luego solo lectura. false = nunca bloquear (emergencias o pilotos).
    enforce: ${SUBSCRIPTION_ENFORCE:true}
    wompi-base-url: ${WOMPI_BASE_URL:https://production.wompi.co/v1}
    wompi-public-key: ${WOMPI_PUBLIC_KEY:}
    wompi-private-key: ${WOMPI_PRIVATE_KEY:}
    wompi-integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
  # Llave compartida con el backend de Ecomerxio para su Super Admin (/api/platform). Vacía = API apagada.
  platform:
    admin-key: ${PLATFORM_ADMIN_KEY:}
  # Escudo de la API (web/RequestGuardFilter): peticiones por IP y minuto, y tamaño máximo del cuerpo.
  guard:
    per-minute: ${GUARD_PER_MINUTE:600}
    public-per-minute: ${GUARD_PUBLIC_PER_MINUTE:120}
    max-body-mb: ${GUARD_MAX_BODY_MB:15}
    max-backup-mb: ${GUARD_MAX_BACKUP_MB:200}
  login:
    max-failed-attempts: 5
    lock-minutes: 15
