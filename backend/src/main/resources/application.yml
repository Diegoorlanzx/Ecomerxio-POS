spring:
  application:
    name: tiendaposs
  web:
    locale: es
    locale-resolver: fixed
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55434/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8090}
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    # Sesión de un turno de trabajo largo.
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5190}
  frontend-url: ${FRONTEND_URL:http://localhost:5190}
  mail-from: ${MAIL_FROM:no-responder@tiendaposs.com}
  login:
    max-failed-attempts: 5
    lock-minutes: 15
